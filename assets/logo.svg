<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9941C" />
      <stop offset="100%" stop-color="#BD7E15" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A2810" />
      <stop offset="100%" stop-color="#2D1F0C" />
    </linearGradient>
  </defs>

  <!-- Logo Emblem Shield & Bovino Silhouette -->
  <g transform="translate(5, 5)">
    <!-- Shield Outer Frame -->
    <rect width="50" height="50" rx="14" fill="url(#darkGrad)"/>
    <rect width="46" height="46" x="2" y="2" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Agro Shield Lines / Cattle Horns & Focus Lens Concept -->
    <path d="M16 22 L25 14 L34 22 V38 C34 39.5 32.5 41 31 41 H19 C17.5 41 16 39.5 16 38 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Focus Crosshair Center -->
    <circle cx="25" cy="27" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="25" cy="27" r="2" fill="#D9941C"/>
  </g>

  <!-- Logo Typography -->
  <g transform="translate(66, 36)">
    <!-- BOVINO text -->
    <text x="0" y="0" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="21" fill="#2D1F0C" letter-spacing="-0.5">BOVINO</text>
    <!-- EM FOCO text -->
    <text x="94" y="0" font-family="'Montserrat', 'Inter', sans-serif" font-weight="900" font-size="21" fill="#BD7E15" letter-spacing="-0.5">EM FOCO</text>
    <!-- Subtitle text -->
    <text x="1" y="14" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#7A6855" letter-spacing="2">CENTRAL DE ENTREGÁVEIS</text>
  </g>
</svg>
